<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Заполнение продуктовых карточек с помощью JS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    />
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <main class="catalog">
      <div class="catalog__container container">
        <h1 class="catalog__title title">Выбери свой продукт</h1>
        <ul class="products clear-list">
          <template id="products-template">
            <li class="products__item card">
              <img class="card__image" />
              <span class="card__category"></span>
              <h2 class="card__title"></h2>
              <p class="card__description"></p>
              <div class="card__compound compound">
                <span class="compound__name">Состав:</span>
                <ul class="compound__list">
                  <li class="compound__item"></li>
                </ul>
              </div>
              <div class="card__price price">
                <b class="price__label">Цена</b>
                <span class="price__value"></span>
              </div>
            </li>
          </template>
        </ul>
      </div>
    </main>
    <script type="module" src="homework-10.js"></script>
  </body>
</html>
