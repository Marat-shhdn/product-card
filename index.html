<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Продуктовые карточки</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    />
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <main class="catalog">
      <div class="catalog__container container">
        <h1 class="catalog__title title">Выбери свой продукт</h1>
        <button id="change-color-first-card-btn">
          Сменить цвет первой карточки
        </button>
        <button id="change-color-all-cards-btn">
          Сменить цвет всех карточек
        </button>
        <button id="go-google-btn">Go Google</button>
        <button id="msg-console-Log-btn">Вывести сообщение в консоль</button>
        <button id="change-color-btn" class="first-color second-color">
          Нажми, чтобы поменять цвет
        </button>

        <button id="registration-btn">Регистрация</button>
        <ul class="products clear-list">
          <template id="products-template">
            <li class="products__item card">
              <img class="card__image" />
              <span class="card__category"></span>
              <h2 class="card__title"></h2>
              <p class="card__description"></p>
              <div class="card__compound compound">
                <span class="compound__name">Состав:</span>
                <ul class="compound__list">
                  <li class="compound__item"></li>
                </ul>
              </div>
              <div class="card__price price">
                <b class="price__label">Цена</b>
                <span class="price__value"> &#8381;</span>
              </div>
            </li>
          </template>
        </ul>
      </div>
    </main>
    <footer class="footer">
      <div class="footer__main">
        <div class="footer__content">
          <p class="footer__title">Product Cards</p>
          <p class="footer__description">
            У нас самые лучшие продукты для кожи!
          </p>
        </div>
        <form class="footer__form form" id="footer__form">
          <label class="form__label" for="email"
            >Подпишись на наши акции:</label
          >
          <div class="form__subscribe">
            <input
              class="form__input"
              type="email"
              placeholder="Введите email"
              name="email"
              id="email"
              required
            />
            <button type="submit" id="subscribeBtn" class="form__button">
              Подписаться
            </button>
          </div>
        </form>
        <nav>
          <p class="nav__menu">Быстрые ссылки</p>
          <ul class="clear-list">
            <li><a href="#">Главная</a></li>
            <li><a href="#">Магазин</a></li>
            <li><a href="#">Контакты</a></li>
          </ul>
        </nav>
        <p class="footer_social">
          <a href="https://t.me" target="_blank">
            <!-- Путь ведет в папку images на вашем компьютере -->
            <img src="img/tg.svg" alt="Telegram" width="21" height="17.61" />
          </a>
          <a href="https://vk.com" target="_blank">
            <!-- Путь ведет в папку images на вашем компьютере -->
            <img src="img/vk.svg" alt="ВКонтакте" width="24" height="14" />
          </a>
        </p>
      </div>
      <div class="footer__line"></div>
      <div class="footer__copyright">
        <p>www.product-cards.com©all right reserve</p>
      </div>
    </footer>

    <div class="modal" id="modal">
      <div class="modal__overlay"></div>
      <div class="modal__content">
        <span class="close-btn">&times;</span>
        <form class="modal__form" id="modal__form">
          <label class="modal__item" for="email"
            >Зарегистрируйтесь в качестве пользователя</label
          >
          <input
            class="modal__item"
            placeholder="Введите свое имя"
            name="userName"
            required
            minlength="2"
          />
          <input
            class="modal__item"
            placeholder="Введите свою фамилию"
            name="userSurname"
            required
            minlength="2"
          />
          <input
            class="modal__item"
            placeholder="Введите дату рождения"
            name="dateOfBirth"
            type="date"
            required
          />
          <input
            class="modal__item"
            placeholder="Введите номер телефона"
            name="numberOfTelephone"
            type="tel"
          />
          <input
            class="modal__item"
            placeholder="Введите ваш логин"
            name="login"
            type="text"
            required
            minlength="2"
          />
          <input
            class="modal__item"
            placeholder="Введите ваш пароль"
            type="password"
            name="password"
            required
            id="password"
          />
          <input
            class="modal__item"
            placeholder="Повторите пароль"
            type="password"
            name="checkPassword"
            required
            id="checkPassword"
          />
          <button class="modal__item" type="submit">Oтпpaвить</button>
        </form>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
